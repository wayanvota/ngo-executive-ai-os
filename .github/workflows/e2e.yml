name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q tests
      - run: python -m unittest -v tests.test_e2e
